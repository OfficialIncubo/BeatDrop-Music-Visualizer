name: Deploy BeatDrop website

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/pages-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Notify IndexNow about the updated homepage
        env:
          INDEXNOW_KEY: 099883b8c1d2d9d4819dd2fd71140910
        run: |
          if curl --fail-with-body --silent --show-error \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "{\"host\":\"officialincubo.github.io\",\"key\":\"${INDEXNOW_KEY}\",\"keyLocation\":\"https://officialincubo.github.io/BeatDrop-Music-Visualizer/${INDEXNOW_KEY}.txt\",\"urlList\":[\"https://officialincubo.github.io/BeatDrop-Music-Visualizer/\"]}"; then
            echo 'IndexNow accepted the homepage notification.'
          else
            echo 'IndexNow notification failed; the Pages deployment itself succeeded.'
          fi
