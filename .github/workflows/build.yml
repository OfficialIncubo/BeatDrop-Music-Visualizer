# Generated with Gemini Pro 3.1, modified by Claude and (sometimes) me

name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: # Allows you to run this workflow manually

jobs:
  build:
    name: ${{ matrix.build_name }} (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
        config: [release, release-oldos, full-package]
        include:
          - config: release
            build_name: "Build Release Only"
            artifact_name: "BeatDrop-Release"
          - config: release-oldos
            build_name: "Build Release_OldOS Only"
            artifact_name: "BeatDrop-Release-OldOS"
          - config: full-package
            build_name: "Build Full Package"
            artifact_name: "BeatDrop-Full-Package"
    runs-on: ${{ matrix.os }}

    steps:
    - name: Harden Git line-ending handling before checkout
      shell: bash
      run: git config --global core.autocrlf false

    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Hash source resources (diagnostic baseline)
      shell: pwsh
      run: |
        $hashes = Get-ChildItem -Path "resources" -Recurse -File | Get-FileHash -Algorithm SHA256 |
          Select-Object Hash, @{N='Path'; E={ $_.Path.Substring((Resolve-Path resources).Path.Length + 1) }}
        $hashes | Export-Csv -Path "$env:RUNNER_TEMP\source-resource-hashes.csv" -NoTypeInformation
        Write-Host "Hashed $($hashes.Count) files under resources/."

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Update vcpkg baseline and install dependencies
      shell: bash
      run: |
        vcpkg integrate install
        vcpkg x-update-baseline
        vcpkg install --triplet x86-windows

    - name: Copy projectM-eval libraries from vcpkg
      shell: bash
      run: |
        mkdir -p lib
        mkdir -p ns-eel2-shim
        find vcpkg_installed -name "projectM_eval.lib" -exec cp {} lib/ \;
        find vcpkg_installed -name "projectM_ns-eel2.lib" -exec cp {} lib/ \;
        find vcpkg_installed -name "ns-eel.h" -exec cp {} ns-eel2-shim/ \;

    - name: Install Legacy DirectX SDK
      shell: powershell
      run: |
        choco install directx-sdk -y
        echo "DXSDK_DIR=C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)" >> $env:GITHUB_ENV

    - name: Build BeatDrop (Release)
      if: matrix.config == 'release' || matrix.config == 'full-package'
      shell: cmd
      env:
        INCLUDE: 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\Include;%INCLUDE%'
        LIB: 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\Lib\x86;%LIB%'
      run: |
        msbuild BeatDrop.sln /p:Configuration="Release" /p:Platform="Win32" /m

    - name: Copy BeatDrop executable to package
      if: matrix.config == 'release' || matrix.config == 'full-package'
      shell: bash
      run: |
        mkdir -p BeatDrop
        cp vis_milk2/Release/BeatDrop.exe BeatDrop/

    - name: Build BeatDrop (Release_OldOS)
      if: matrix.config == 'release-oldos' || matrix.config == 'full-package'
      shell: cmd
      env:
        INCLUDE: 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\Include;%INCLUDE%'
        LIB: 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\Lib\x86;%LIB%'
      run: |
        msbuild BeatDrop.sln /p:Configuration="Release_OldOS" /p:Platform="Win32" /m

    - name: Copy BeatDrop_OldOS executable to package
      if: matrix.config == 'release-oldos' || matrix.config == 'full-package'
      shell: bash
      run: |
        mkdir -p BeatDrop
        cp vis_milk2/Release/BeatDrop_OldOS.exe BeatDrop/

    - name: Post-Build Packaging
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "BeatDrop\BeatDrop Resources"
        Copy-Item -Path "resources\Milkdrop2\*" -Destination "BeatDrop\BeatDrop Resources" -Recurse -Force
        Copy-Item -Path "resources\beatdrop.ini" -Destination "BeatDrop\" -Force
        Copy-Item -Path "resources\beatdrop_img.ini" -Destination "BeatDrop\" -Force
        Copy-Item -Path "resources\beatdrop_msg.ini" -Destination "BeatDrop\" -Force
        Copy-Item -Path "resources\precache.txt" -Destination "BeatDrop\" -Force

    - name: Verify packaged resources are byte-identical to checkout
      shell: pwsh
      run: |
        $baseline = Import-Csv "$env:RUNNER_TEMP\source-resource-hashes.csv"
        $problems = @()
        foreach ($row in $baseline) {
          $target = Join-Path "BeatDrop\BeatDrop Resources" $row.Path
          if (-not (Test-Path -LiteralPath $target)) {
            $problems += "MISSING: $($row.Path)"
            continue
          }
          $actualHash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
          if ($actualHash -ne $row.Hash) {
            $problems += "HASH MISMATCH: $($row.Path)"
          }
        }
        if ($problems.Count -gt 0) {
          foreach ($p in $problems) { Write-Host "::error::$p" }
          throw "$($problems.Count) resource file(s) differ between checkout and the packaged artifact. See the ::error:: lines above for exact paths."
        }
        Write-Host "Verified $($baseline.Count) resource files are byte-identical between checkout and package."
        Copy-Item "$env:RUNNER_TEMP\source-resource-hashes.csv" "BeatDrop\resource-hashes.csv"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}-${{ matrix.os }}
        path: BeatDrop/
        if-no-files-found: error
        compression-level: 0