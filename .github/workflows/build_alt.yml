# Generated with Gemini Pro 3.1, modified by Claude and (sometimes) me

name: Alternate Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: # Allows you to run this workflow manually

jobs:
  build:
    name: ${{ matrix.build_name }} (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
        config: [release, release-oldos, full-package]
        include:
          - config: release
            build_name: "Build Release Only"
            artifact_name: "BeatDrop-Release"
          - config: release-oldos
            build_name: "Build Release_OldOS Only"
            artifact_name: "BeatDrop-Release-OldOS"
          - config: full-package
            build_name: "Build Full Package"
            artifact_name: "BeatDrop-Full-Package"
    runs-on: ${{ matrix.os }}

    steps:
    - name: Harden Git line-ending handling before checkout
      shell: bash
      run: git config --global core.autocrlf false

    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Hash source resources (diagnostic baseline)
      shell: pwsh
      run: |
        $copyMap = @(
          @{ Source = "resources\Milkdrop2"; Dest = "BeatDrop\BeatDrop Resources"; Recurse = $true }
          @{ Source = "resources\precache.txt"; Dest = "BeatDrop\precache.txt"; Recurse = $false }
          @{ Source = "resources\beatdrop.ini"; Dest = "BeatDrop\beatdrop.ini"; Recurse = $false }
          @{ Source = "resources\beatdrop_img.ini"; Dest = "BeatDrop\beatdrop_img.ini"; Recurse = $false }
          @{ Source = "resources\beatdrop_msg.ini"; Dest = "BeatDrop\beatdrop_msg.ini"; Recurse = $false }
        )
        $baseline = @()
        foreach ($entry in $copyMap) {
          if ($entry.Recurse) {
            $srcRoot = (Resolve-Path $entry.Source).Path
            Get-ChildItem -Path $entry.Source -Recurse -File | ForEach-Object {
              $relPath = $_.FullName.Substring($srcRoot.Length + 1)
              $baseline += [PSCustomObject]@{
                Hash     = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
                DestPath = Join-Path $entry.Dest $relPath
              }
            }
          } else {
            $baseline += [PSCustomObject]@{
              Hash     = (Get-FileHash -LiteralPath $entry.Source -Algorithm SHA256).Hash
              DestPath = $entry.Dest
            }
          }
        }
        $baseline | Export-Csv -Path "$env:RUNNER_TEMP\source-resource-hashes.csv" -NoTypeInformation
        Write-Host "Hashed $($baseline.Count) files that will be packaged."

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Cache vcpkg binary archives
      uses: actions/cache@v6
      with:
        path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
        key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-archives-${{ runner.os }}-

    - name: Update vcpkg baseline and install dependencies
      shell: bash
      run: |
        vcpkg integrate install
        vcpkg x-update-baseline
        vcpkg install --triplet x86-windows

    - name: Clone and Build projectM-eval
      shell: bash
      run: |
        # Clone projectM-eval
        git clone https://github.com/projectM-visualizer/projectm-eval.git
        cd projectm-eval
        git fetch --all
        
        # Setup build directories
        mkdir projectm-eval-build
        cd projectm-eval-build
        
        # Generate project files and force BUILD_NS_EEL_SHIM to ON
        cmake -A Win32 -DBUILD_NS_EEL_SHIM=ON ..
        
        # Build and install
        cmake --build . --config "Release" --parallel
        cmake --install . --prefix projectm-eval-install

    - name: Copy projectM-eval libraries
      shell: bash
      run: |
        mkdir -p lib
        mkdir -p ns-eel2-shim
        cp projectm-eval/projectm-eval-build/projectm-eval-install/lib/projectM_eval.lib lib/
        cp projectm-eval/projectm-eval-build/projectm-eval-install/lib/projectM_ns-eel2.lib lib/
        cp projectm-eval/projectm-eval-build/projectm-eval-install/include/projectm-eval/ns-eel2/ns-eel.h ns-eel2-shim/

    - name: Install Legacy DirectX SDK
      shell: powershell
      run: |
        choco install directx-sdk -y
        # Setting environment variables for the current session
        echo "DXSDK_DIR=C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)" >> $env:GITHUB_ENV

    - name: Build BeatDrop (Release)
      if: matrix.config == 'release' || matrix.config == 'full-package'
      shell: cmd
      env:
        INCLUDE: 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\Include;%INCLUDE%'
        LIB: 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\Lib\x86;%LIB%'
      run: |
        :: Build the main project solution using the Release configuration
        msbuild BeatDrop.sln /p:Configuration="Release" /p:Platform="Win32" /m

    - name: Copy BeatDrop executable to package
      if: matrix.config == 'release' || matrix.config == 'full-package'
      shell: bash
      run: |
        mkdir -p BeatDrop
        cp vis_milk2/Release/BeatDrop.exe BeatDrop/

    - name: Build BeatDrop (Release_OldOS)
      if: matrix.config == 'release-oldos' || matrix.config == 'full-package'
      shell: cmd
      env:
        INCLUDE: 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\Include;%INCLUDE%'
        LIB: 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\Lib\x86;%LIB%'
      run: |
        :: Build the main project solution using the Release_OldOS configuration
        msbuild BeatDrop.sln /p:Configuration="Release_OldOS" /p:Platform="Win32" /m

    - name: Copy BeatDrop_OldOS executable to package
      if: matrix.config == 'release-oldos' || matrix.config == 'full-package'
      shell: bash
      run: |
        mkdir -p BeatDrop
        cp vis_milk2/Release/BeatDrop_OldOS.exe BeatDrop/

    - name: Post-Build Packaging
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "BeatDrop\BeatDrop Resources"
        Copy-Item -Path "resources\Milkdrop2\*" -Destination "BeatDrop\BeatDrop Resources" -Recurse -Force
        Copy-Item -Path "resources\beatdrop.ini" -Destination "BeatDrop\" -Force
        Copy-Item -Path "resources\beatdrop_img.ini" -Destination "BeatDrop\" -Force
        Copy-Item -Path "resources\beatdrop_msg.ini" -Destination "BeatDrop\" -Force
        Copy-Item -Path "resources\precache.txt" -Destination "BeatDrop\" -Force

    - name: Verify packaged resources are byte-identical to checkout
      shell: pwsh
      run: |
        $baseline = Import-Csv "$env:RUNNER_TEMP\source-resource-hashes.csv"
        $problems = @()
        foreach ($row in $baseline) {
          if (-not (Test-Path -LiteralPath $row.DestPath)) {
            $problems += "MISSING: $($row.DestPath)"
            continue
          }
          $actualHash = (Get-FileHash -LiteralPath $row.DestPath -Algorithm SHA256).Hash
          if ($actualHash -ne $row.Hash) {
            $problems += "HASH MISMATCH: $($row.DestPath)"
          }
        }
        if ($problems.Count -gt 0) {
          foreach ($p in $problems) { Write-Host "::error::$p" }
          throw "$($problems.Count) resource file(s) differ between checkout and the packaged artifact. See the ::error:: lines above for exact paths."
        }
        Write-Host "Verified $($baseline.Count) resource files are byte-identical between checkout and package."
        Copy-Item "$env:RUNNER_TEMP\source-resource-hashes.csv" "BeatDrop\resource-hashes.csv"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}-${{ matrix.os }}
        path: BeatDrop/
        if-no-files-found: error
        compression-level: 0